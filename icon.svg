  <!-- Pest -->
  <g fill="#14103A" stroke="#14103A" stroke-linecap="round">
    <ellipse cx="128" cy="184" rx="17" ry="21" stroke="none"/>
    <circle cx="128" cy="157" r="10" stroke="none"/>
    <path d="M112 176l-14-6M111 190l-14 5M144 176l14-6M145 190l14 5M122 149l-6-9M134 149l6-9" stroke-width="6" fill="none"/>
  </g>

  <!-- Passing badge -->
  <circle cx="194" cy="70" r="36" fill="#22C55E" stroke="#14103A" stroke-width="8"/>
  <path d="M177 70l12 12 22-23" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

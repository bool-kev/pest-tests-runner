<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Pest Tests Runner: test flask (VS Code Testing view) holding a pest, with a passing badge -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1B6B"/>
      <stop offset="1" stop-color="#14103A"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#background)"/>

  <!-- Liquid -->
  <path d="M80 150h96l28 50a10 10 0 0 1-9 15H61a10 10 0 0 1-9-15z" fill="#5EEAD4"/>

